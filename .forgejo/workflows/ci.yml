name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file.
  # Do NOT set for miri jobs (miri intercepts rustc itself): override with
  # RUSTC_WRAPPER: "" at job level there.
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 3.
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo test --all-features --locked
      - name: sccache stats
        if: always()
        run: /srv/cache/bin/sccache --show-stats

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo check --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --no-deps --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --locked --summary-only

  bench-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo bench --no-run --locked

  publish-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo publish --dry-run

  docs-mermaid:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      # Offline lint first — no browser, catches the common mermaid mistakes
      # fast and always runs even if the render step below has trouble.
      - name: Offline mermaid lint
        run: python3 scripts/mermaid_lint.py $(git ls-files '*.md')
      - uses: https://github.com/actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11
      - name: Install headless-chromium runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 fonts-liberation
      # Authoritative check: render every mermaid block through mmdc.
      - name: Render-check every mermaid block
        run: ./scripts/check-docs.sh
