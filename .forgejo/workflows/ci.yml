name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # Shared compiler cache on the self-hosted runner; absent on forks.
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - run: cargo test --all-features --locked
      - name: sccache stats
        if: always()
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            /srv/cache/bin/sccache --show-stats
          fi

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo check --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo doc --no-deps --all-features --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --locked --summary-only

  bench-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo bench --no-run --locked

  publish-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Enable sccache if available
        run: |
          if [ -x /srv/cache/bin/sccache ]; then
            echo "RUSTC_WRAPPER=/srv/cache/bin/sccache" >> "$GITHUB_ENV"
          fi
      - run: cargo publish --dry-run
