# zblob — graduated from the ZenSight monorepo (formerly the in-tree
# `zenoh-blob` crate; renamed on extraction, epic zensight#193 / #202).

# Empty workspace table so this is unambiguously its own workspace root
# (never captured by a parent directory's workspace).
[workspace]

[package]
name = "zblob"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Generic resumable chunked blob & directory transfer over Zenoh (progress, SHA-256, resume)"
repository = "https://github.com/p13marc/zblob"
readme = "README.md"
keywords = ["zenoh", "transfer", "chunked", "resume", "content-addressed"]
categories = ["network-programming", "filesystem"]

[dependencies]
zenoh = { version = "1.9", features = ["unstable"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fastcdc = "4"
blake3 = "1.8"
bao-tree = { version = "0.16", default-features = false, features = ["fs", "validate"] }
postcard = { version = "1.1", features = ["use-std"] }
tempfile = "3"
zstd = { version = "0.13", optional = true }
tracing = { version = "0.1", optional = true }
zenoh-ext = { version = "1.9", features = ["unstable"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

[features]
# Per-chunk zstd compression for Tier-2 chunk containers (wire + at rest).
zstd = ["dep:zstd"]
# Emit `tracing` events at registration/serve/download/GC points.
tracing = ["dep:tracing"]
# One-to-many fanout tier over zenoh-ext AdvancedPublisher.
fanout = ["dep:zenoh-ext"]
# Per-chunk XChaCha20-Poly1305 encryption at rest for DirStore.
encryption = ["dep:chacha20poly1305"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
