# Cross-platform matrix for the GitHub mirror (the primary Forgejo CI runner
# is Linux-only): the #[cfg(windows)]/#[cfg(not(unix))] branches must compile
# and the platform-neutral suite must pass everywhere.
name: CI (cross-platform)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xplat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --locked
      - run: cargo test --all-features --locked
